<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Service Timings - IPA Church</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="justify-content: center; align-items: center; padding: 50px;">
    
    <div style="text-align: center; width: 100%;">
        <h1 style="color: var(--neon-purple); font-size: 3rem; margin-bottom: 20px;">Service Timings</h1>
        <div class="card card-purple reveal" style="max-width: 600px; margin: 0 auto; text-align: left;">
            
            <div id="live-church-timings" style="white-space: pre-line; color: #fff; line-height: 2; font-size: 1.1rem;">
                Loading live schedules...
            </div>
            
            <br>
            <a href="index.html" class="btn-outline">Back to Home</a>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script>
      // Insert your exact Firebase web config object keys here
      const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      db.collection("church_settings").doc("live_data").onSnapshot((doc) => {
        const timingsContainer = document.getElementById("live-church-timings");
        if (doc.exists && doc.data().timings) {
          timingsContainer.innerText = doc.data().timings;
        } else {
          // Hardcoded backup template fallback
          timingsContainer.innerHTML = `Sunday: 6:30 AM - 8:00 AM & 8:00 AM - 11:00 AM\nFriday: 10:00 AM (Fasting Prayer)\nFirst Saturday: 10:00 AM (Monthly Fasting Prayer)`;
        }
      }, (error) => {
         console.error("Firebase read runtime mismatch:", error);
         document.getElementById("live-church-timings").innerText = "Unable to download current timeline configurations.";
      });
    </script>

    <script src="script.js"></script>
</body>
</html>
