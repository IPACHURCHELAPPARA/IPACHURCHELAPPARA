<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="padding: 50px 5%; align-items: center;">
    
    <div style="width: 100%; max-width: 800px;">
        <h1 style="color: var(--neon-teal); margin-bottom: 10px;">Control Center</h1>
        <p style="color: var(--text-muted); margin-bottom: 30px;">Authorized Access Only. Settings adjust live configurations automatically across client endpoints.</p>
        
        <div class="card card-teal reveal" style="width: 100%;">
            <form id="admin-control-form">
                
                <label style="display:block; margin-bottom: 5px; font-weight: bold;">Update Daily Verse (Text):</label>
                <input type="text" id="custom-verse-text" placeholder="Enter custom verse override (Leave blank to use default script rotation)" style="width: 100%; padding: 10px; margin-bottom: 15px; background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: #fff; border-radius: 5px;">

                <label style="display:block; margin-bottom: 5px; font-weight: bold;">Update Daily Verse (Reference):</label>
                <input type="text" id="custom-verse-ref" placeholder="e.g. John 3:16" style="width: 100%; padding: 10px; margin-bottom: 20px; background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: #fff; border-radius: 5px;">

                <label style="display:block; margin-bottom: 5px; font-weight: bold;">Update Timings:</label>
                <textarea id="custom-timings" rows="3" style="width: 100%; padding: 10px; margin-bottom: 20px; background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: #fff; border-radius: 5px;">Sunday: 6:30 AM - 8:00 AM & 8:00 AM - 11:00 AM</textarea>

                <label style="display:block; margin-bottom: 5px; font-weight: bold;">YouTube Channel Link:</label>
                <input type="text" id="custom-youtube" value="https://www.youtube.com/@IpaChurchInElappara" style="width: 100%; padding: 10px; margin-bottom: 20px; background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: #fff; border-radius: 5px;">

                <label style="display:block; margin-bottom: 5px; font-weight: bold;">Location / Address:</label>
                <input type="text" id="custom-address" value="IPA Church Elappara Idukki Kerala India" style="width: 100%; padding: 10px; margin-bottom: 20px; background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: #fff; border-radius: 5px;">

                <button type="submit" class="btn-gradient" style="border: none; cursor: pointer; display: inline-block; margin-right: 15px;">Save All Changes</button>
                <a href="index.html" class="btn-outline">Exit Control</a>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
      const documentReference = db.collection("church_settings").doc("live_data");

      // 1. Initial Document Fetcher to populate fields with current live status
      documentReference.get().then((doc) => {
        if (doc.exists) {
          const currentSettings = doc.data();
          if (currentSettings.verseText) document.getElementById("custom-verse-text").value = currentSettings.verseText;
          if (currentSettings.verseRef) document.getElementById("custom-verse-ref").value = currentSettings.verseRef;
          if (currentSettings.timings) document.getElementById("custom-timings").value = currentSettings.timings;
          if (currentSettings.youtubeLink) document.getElementById("custom-youtube").value = currentSettings.youtubeLink;
          if (currentSettings.locationAddress) document.getElementById("custom-address").value = currentSettings.locationAddress;
        }
      }).catch((err) => {
         console.error("Initial data loading fault:", err);
      });

      // 2. Stream Data Updates Back to Firestore Document
      document.getElementById("admin-control-form").addEventListener("submit", (event) => {
        event.preventDefault();
        
        const packagePayload = {
          verseText: document.getElementById("custom-verse-text").value.trim(),
          verseRef: document.getElementById("custom-verse-ref").value.trim(),
          timings: document.getElementById("custom-timings").value.trim(),
          youtubeLink: document.getElementById("custom-youtube").value.trim(),
          locationAddress: document.getElementById("custom-address").value.trim()
        };

        documentReference.set(packagePayload, { merge: true })
          .then(() => {
             alert("All changes successfully saved to the live database!");
          })
          .catch((err) => {
             console.error("Write error encountered:", err);
             alert("Save Operation Aborted. Review administrative permissions and connection configurations.");
          });
      });
    </script>

    <script src="script.js"></script>
</body>
</html>
